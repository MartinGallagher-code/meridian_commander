[build-system]
# Deliberately modest so the project builds on older machines, corporate
# mirrors and air-gapped boxes: any setuptools from 61 (the first with
# pyproject [project] support) works. That is also why the license uses the
# classic table form instead of the newer PEP 639 SPDX string, which would
# require setuptools >= 77.
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-commander"
version = "1.3.0"
description = "Two-pane terminal file manager (Midnight Commander style): local + SFTP/SSH/FTP panes, cross-location copy/move, bidirectional sync, in-pane terminal, viewer, editor, .xlsx grid, .docx document, .pptx slide, rendered Markdown, colour image and PDF browsers, zip/tar archives browsable as directories, and plug-ins."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Martin Gallagher" }]
keywords = [
    "file-manager", "tui", "curses", "terminal", "two-pane",
    "midnight-commander", "sftp", "ssh", "ftp", "sync",
    "xlsx", "spreadsheet", "docx", "word", "pptx", "powerpoint",
    "markdown", "zip", "tar", "archive",
    "image", "png", "jpeg", "gif", "bmp", "image-viewer", "ascii-art",
    "pdf", "pdf-viewer", "text-extraction",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: System :: Filesystems",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
# The core runs on the standard library alone (curses, ftplib, ...).
dependencies = []

[project.optional-dependencies]
# SFTP and SSH-shell browsing, the in-pane remote terminal, and the SSH
# plug-ins need paramiko; without it the app runs and reports what to install.
ssh = ["paramiko>=2.7"]
sftp = ["paramiko>=2.7"]        # kept as an alias of "ssh"
# The data plugins (Profile/Clean/Build table) run on the standard library
# alone; pandas only accelerates group-by aggregation on large files when
# present. Everything degrades gracefully without it.
data = ["pandas>=1.3"]
# pandas is here so the pandas-backed group-by path is exercised by the tests
# as well as the stdlib fallback; it stays optional for users.
# pytest-timeout turns a wedged test into a failure instead of a run that
# sits until the CI provider's own limit expires; ruff and mypy back the
# lint job. All four are developer tooling, never needed to run the app.
dev = ["paramiko>=2.7", "pandas>=1.3", "pytest>=7.0", "pytest-timeout>=2.1",
       "coverage>=6.0", "ruff>=0.6", "mypy>=1.8", "build", "twine"]

[project.scripts]
meridian-commander = "meridian_commander.app:main"
meridian = "meridian_commander.app:main"

[project.urls]
Homepage = "https://github.com/MartinGallagher-code/meridian_commander"
Repository = "https://github.com/MartinGallagher-code/meridian_commander"
Issues = "https://github.com/MartinGallagher-code/meridian_commander/issues"

[tool.setuptools]
packages = ["meridian_commander", "meridian_commander.plugins"]

[tool.ruff]
# The tree's own habit is to wrap around 79; this is the ceiling rather than
# the target, set where the handful of deliberately longer lines already sit
# so that enforcing it costs no reflow.
line-length = 100
# Every version the classifiers promise has to accept the result, so the
# oldest of them decides what counts as valid syntax.
target-version = "py39"

[tool.ruff.lint]
# Bugs, not taste. E/F/W are the pycodestyle-and-pyflakes baseline that
# catches dead names and typos -- a duplicated dictionary key and three
# variables assigned and never read were sitting in the tree before this was
# turned on. B, C4 and PIE add patterns that are wrong rather than merely
# unfashionable. Deliberately absent: I (import order), UP, SIM and RET,
# which would rewrite a great deal of working, readable code to taste.
select = ["E", "F", "W", "B", "C4", "PIE"]

[tool.mypy]
# The oldest interpreter the classifiers promise, so a 3.10-only idiom is
# caught here rather than by a user on 3.9.
python_version = "3.9"
# paramiko is optional and ships no stubs. Both halves of that matter:
# ignore_missing_imports covers the environment where it is not installed at
# all (a supported state -- every import of it is guarded), and disabling
# import-untyped below covers the one where it is, since types-paramiko is
# not worth making a hard requirement of running the type checker.
ignore_missing_imports = true
#
# The tree is annotated throughout but had never been type-checked, so this
# starts as a ratchet rather than a clean sweep: everything mypy can already
# prove is enforced, and the seventy-odd findings in the categories below are
# a backlog to be worked off a file at a time, deleting each line as its last
# case goes. Turning them all on today would mean either seventy unreviewed
# edits through the PDF, image and curses code or a blanket ignore, and both
# are worse than an honest list.
#
#   attr-defined  (19)  mostly PluginContext.app, deliberately typed `object`
#                       and duck-called; wants a Protocol
#   union-attr    (15)  paramiko handles that are None until connected
#   index         (10)  a loop variable reused for a different type further
#                       down the same function -- real confusion, no bug yet
#   arg-type      (13)
#   assignment    (10)
#   list-item      (1)
#   call-overload  (1)
disable_error_code = [
    "attr-defined", "union-attr", "index", "arg-type", "assignment",
    "list-item", "call-overload",
    "import-untyped",   # paramiko, per the note above
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test that stops making progress must fail, not wait: without this a
# wedged test holds the run until the CI provider kills the job, minutes or
# hours later, with no clue as to where it stopped.
#
# The "thread" method rather than the default SIGALRM, which is delivered to
# a process blocked inside a C write() that retries on EINTR without ever
# returning to Python, so the handler that would raise the timeout never
# runs. The whole suite takes about half a minute, so 120s is far past any
# honest test while still failing fast.
#
# One hang this cannot catch, and it is worth knowing which: a hang *inside
# curses*. CPython's _curses does not release the GIL, so a main thread
# stuck in doupdate() holds it, and the watchdog thread never gets to run to
# do the killing. Verified by reproducing it -- the run sails past 120s. For
# that case the backstop is timeout-minutes on the CI job, and the diagnosis
# is faulthandler below.
timeout = 120
timeout_method = "thread"
# Thirty seconds before that, pytest's own faulthandler dumps every thread's
# stack. It is the half that always works: the dump is driven from a C
# thread that needs no GIL, and it writes to the stderr pytest stashed
# before it started capturing, so it survives both the capture and the exit.
# On the first macOS run it named the wedged line on the first attempt,
# where the timeout above could not fire at all.
faulthandler_timeout = 90
# An xfail that starts passing is a test that has stopped testing what it
# says; say so rather than reporting it as a pass.
xfail_strict = true

[tool.coverage.run]
source = ["meridian_commander"]

[tool.coverage.report]
precision = 1
show_missing = true
# The suite covers every statement and CI fails if that stops being true.
# There are no exclude_lines rules and exactly one "# pragma: no cover" in the
# tree -- the forked child of pty.fork(), which execs into the shell before any
# in-process tracer could record it -- so this number is the honest one.
#
# Python 3.9 reports 99.9%: before PEP 626 (3.10) the tracer misses a "break"
# that follows an if-block ending in its own jump, so two statements read as
# unexecuted there despite running. The workflow enforces the gate on 3.10+.
fail_under = 100

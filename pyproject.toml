[build-system]
# Deliberately modest so the project builds on older machines, corporate
# mirrors and air-gapped boxes: any setuptools from 61 (the first with
# pyproject [project] support) works. That is also why the license uses the
# classic table form instead of the newer PEP 639 SPDX string, which would
# require setuptools >= 77.
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-commander"
version = "1.3.0"
description = "Two-pane terminal file manager (Midnight Commander style): local + SFTP/SSH/FTP panes, cross-location copy/move, bidirectional sync, in-pane terminal, viewer, editor, .xlsx grid, .docx document, .pptx slide, rendered Markdown, colour image and PDF browsers, zip/tar archives browsable as directories, and plug-ins."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Martin Gallagher" }]
keywords = [
    "file-manager", "tui", "curses", "terminal", "two-pane",
    "midnight-commander", "sftp", "ssh", "ftp", "sync",
    "xlsx", "spreadsheet", "docx", "word", "pptx", "powerpoint",
    "markdown", "zip", "tar", "archive",
    "image", "png", "jpeg", "gif", "bmp", "image-viewer", "ascii-art",
    "pdf", "pdf-viewer", "text-extraction",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: System :: Filesystems",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
# The core runs on the standard library alone (curses, ftplib, ...).
dependencies = []

[project.optional-dependencies]
# SFTP and SSH-shell browsing, the in-pane remote terminal, and the SSH
# plug-ins need paramiko; without it the app runs and reports what to install.
ssh = ["paramiko>=2.7"]
sftp = ["paramiko>=2.7"]        # kept as an alias of "ssh"
# The data plugins (Profile/Clean/Build table) run on the standard library
# alone; pandas only accelerates group-by aggregation on large files when
# present. Everything degrades gracefully without it.
data = ["pandas>=1.3"]
# pandas is here so the pandas-backed group-by path is exercised by the tests
# as well as the stdlib fallback; it stays optional for users.
# pytest-timeout turns a wedged test into a failure instead of a run that
# sits until the CI provider's own limit expires; ruff and mypy back the
# lint job. All four are developer tooling, never needed to run the app.
dev = ["paramiko>=2.7", "pandas>=1.3", "pytest>=7.0", "pytest-timeout>=2.1",
       "coverage>=6.0", "ruff>=0.6", "mypy>=1.8", "build", "twine"]

[project.scripts]
meridian-commander = "meridian_commander.app:main"
meridian = "meridian_commander.app:main"

[project.urls]
Homepage = "https://github.com/MartinGallagher-code/meridian_commander"
Repository = "https://github.com/MartinGallagher-code/meridian_commander"
Issues = "https://github.com/MartinGallagher-code/meridian_commander/issues"

[tool.setuptools]
packages = ["meridian_commander", "meridian_commander.plugins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test that stops making progress must fail, not wait. The suite drives a
# real curses screen on a pseudo-terminal, and a write to a terminal nobody
# is reading blocks below the level any Python could interrupt -- so without
# this a single wedged screen holds the run until the CI provider kills the
# job, minutes or hours later, with no clue as to where it stopped.
#
# The "thread" method is the one that works here. The default, SIGALRM, is
# delivered to a process blocked inside curses' own write(), which retries on
# EINTR without ever returning to Python, so the handler that would raise the
# timeout never runs. A watchdog thread owes nothing to the stuck one: it
# dumps every thread's stack -- naming the test and the line -- and ends the
# process. The whole suite runs in about half a minute, so 120s is far past
# any honest test while still failing fast.
timeout = 120
timeout_method = "thread"
# An xfail that starts passing is a test that has stopped testing what it
# says; say so rather than reporting it as a pass.
xfail_strict = true

[tool.coverage.run]
source = ["meridian_commander"]

[tool.coverage.report]
precision = 1
show_missing = true
# The suite covers every statement and CI fails if that stops being true.
# There are no exclude_lines rules and exactly one "# pragma: no cover" in the
# tree -- the forked child of pty.fork(), which execs into the shell before any
# in-process tracer could record it -- so this number is the honest one.
#
# Python 3.9 reports 99.9%: before PEP 626 (3.10) the tracer misses a "break"
# that follows an if-block ending in its own jump, so two statements read as
# unexecuted there despite running. The workflow enforces the gate on 3.10+.
fail_under = 100

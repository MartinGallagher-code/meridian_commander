# Test, build and publish meridian-commander to PyPI.
#
# Publishing uses PyPI "trusted publishing" (OIDC) -- see PUBLISHING.md for
# the one-time PyPI-side setup. The publish job runs on version tags
# (v1.2.3) or when the workflow is dispatched manually from the Actions tab;
# ordinary pushes and pull requests just run the test suite and a build.

name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Style and types, once. Neither depends on the interpreter under test, so
  # running them across the matrix would only buy the same answer five times.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy meridian_commander

  # The manual is the manual now -- the README points at it rather than
  # repeating it -- so a page that stops building, or a cross-reference to a
  # heading someone renamed, is a broken link for every reader. -W turns
  # Sphinx's warnings into the failure they describe.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install -r docs/requirements.txt
      - name: Build the manual
        run: python -m sphinx -b html -W docs docs/_build/html

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One version failing is worth knowing about on the others too, so let
      # the rest of the matrix finish rather than cancelling it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Every version the classifiers in pyproject.toml promise. Claiming
        # support for one that nothing runs is how a release ships broken to
        # exactly the people who read the metadata.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # macOS is a supported platform in the classifiers, and it is the
          # one where this project's foundations differ: a BSD curses with
          # its own terminfo, and Apple's pty. One job on the oldest and one
          # on the newest catch that without paying for the full grid at ten
          # times the minutes of a Linux runner.
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m coverage run -m pytest -q
      - name: Coverage
        # Prints the per-module table and fails below fail_under (100) from
        # pyproject.toml.
        #
        # Except on 3.9, where the total is enforced but not the gate: precise
        # line events arrived with PEP 626 in 3.10, and before that the tracer
        # does not record a "break" that follows an if-block ending in its own
        # jump, even though the statement runs. Two such statements exist here
        # (editor.py's quit path, the FTP reader's EOF), so 3.9 tops out at
        # 99.9%. The report is still printed there, so a genuine regression is
        # visible in the log.
        run: |
          if [ "${{ matrix.python-version }}" = "3.9" ]; then
            python -m coverage report --fail-under=0
          else
            python -m coverage report
          fi

  build:
    needs: [lint, docs, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  # Publish on: a version tag, a manual dispatch, or a push to main whose
  # commit message contains "[release]" (lets a release be cut by merging a
  # PR with that marker in the squash title). Re-publishing an existing
  # version fails safely on the PyPI side.
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.ref == 'refs/heads/main' &&
         contains(github.event.head_commit.message, '[release]'))
      ))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write   # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      # PyPI never lets a filename be reused, so uploading a version that is
      # already released fails -- but it fails inside twine, after the
      # attestations are signed, and the error twine prints on its own line is
      # "400 Bad Request" with the reason buried in an HTML body above it. Ask
      # PyPI first and say the useful thing instead. Only a definite 200 (the
      # version is there) stops the run: a network failure or any other status
      # leaves the decision to the upload, which is the authority anyway.
      - name: Refuse to re-upload a released version
        run: |
          sdist=$(ls dist/*.tar.gz | head -1)
          version=$(basename "$sdist" .tar.gz | sed -E 's/^[^-]+-//')
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/meridian-commander/$version/json" || echo "000")
          echo "meridian-commander $version: PyPI answered $status"
          if [ "$status" = "200" ]; then
            echo "::error::meridian-commander $version is already on PyPI, and PyPI does not allow a file name to be reused, so this upload cannot succeed. Bump the version in pyproject.toml and meridian_commander/__init__.py, then release again."
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1

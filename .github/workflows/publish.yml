# Test, build and publish meridian-commander to PyPI.
#
# Publishing uses PyPI "trusted publishing" (OIDC) -- see PUBLISHING.md for
# the one-time PyPI-side setup. The publish job runs on version tags
# (v1.2.3) or when the workflow is dispatched manually from the Actions tab;
# ordinary pushes and pull requests just run the test suite and a build.

name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Style and types, once. Neither depends on the interpreter under test, so
  # running them across the matrix would only buy the same answer five times.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy meridian_commander

  # The manual is the manual now -- the README points at it rather than
  # repeating it -- so a page that stops building, or a cross-reference to a
  # heading someone renamed, is a broken link for every reader. -W turns
  # Sphinx's warnings into the failure they describe.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install -r docs/requirements.txt
      - name: Build the manual
        run: python -m sphinx -b html -W docs docs/_build/html

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One version failing is worth knowing about on the others too, so let
      # the rest of the matrix finish rather than cancelling it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Every version the classifiers in pyproject.toml promise. Claiming
        # support for one that nothing runs is how a release ships broken to
        # exactly the people who read the metadata.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # macOS is a supported platform in the classifiers, and it is the
          # one where this project's foundations differ: a BSD curses with
          # its own terminfo, and Apple's pty. One job on the oldest and one
          # on the newest catch that without paying for the full grid at ten
          # times the minutes of a Linux runner.
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      # Collection imports every test module and the whole package without
      # running anything, and it is the one phase pytest-timeout does not
      # cover -- so when a run stops dead with no output, this says in
      # seconds whether it even got as far as a test.
      - name: Collect
        run: python -m pytest --collect-only -q | tail -3
      - name: Run tests
        env:
          # A pipe makes Python block-buffer stdout, so a run that is killed
          # mid-way loses every dot it had printed and reports a hang as
          # silence. Stream it instead: the last line names where it stopped.
          PYTHONUNBUFFERED: "1"
        run: python -m coverage run -m pytest -q
      - name: Coverage
        # Prints the per-module table and fails below fail_under (100) from
        # pyproject.toml. Two jobs print without the gate.
        #
        # 3.9, because precise line events arrived with PEP 626 in 3.10, and
        # before that the tracer does not record a "break" that follows an
        # if-block ending in its own jump, even though the statement runs.
        # Two such statements exist here (editor.py's quit path, the FTP
        # reader's EOF), so 3.9 tops out at 99.9%.
        #
        # macOS, because the 378 tests that drive a real curses screen on a
        # pseudo-terminal skip there -- see CURSES_SCREENS in tests/support.py
        # -- which leaves the drawing code unmeasured. The other 2,450 run,
        # which is what these jobs are for; Linux keeps the gate honest.
        #
        # The report is printed either way, so a genuine regression is still
        # visible in the log.
        run: |
          if [ "${{ matrix.python-version }}" = "3.9" ] \
             || [ "${{ runner.os }}" = "macOS" ]; then
            python -m coverage report --fail-under=0
          else
            python -m coverage report
          fi

  build:
    needs: [lint, docs, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  # Publish on: a version tag, a manual dispatch, or a push to main whose
  # commit message contains "[release]" (lets a release be cut by merging a
  # PR with that marker in the squash title). Re-publishing an existing
  # version fails safely on the PyPI side.
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.ref == 'refs/heads/main' &&
         contains(github.event.head_commit.message, '[release]'))
      ))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write   # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      # PyPI never lets a filename be reused, so uploading a version that is
      # already released fails -- but it fails inside twine, after the
      # attestations are signed, and the error twine prints on its own line is
      # "400 Bad Request" with the reason buried in an HTML body above it. Ask
      # PyPI first, and let the two ways of getting here answer differently.
      #
      # Only a definite 200 (the version is there) counts: a network failure
      # or any other status leaves the decision to the upload, which is the
      # authority anyway.
      - name: Ask PyPI whether this version is already released
        id: pypi
        run: |
          sdist=$(ls dist/*.tar.gz | head -1)
          version=$(basename "$sdist" .tar.gz | sed -E 's/^[^-]+-//')
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/meridian-commander/$version/json" || echo "000")
          echo "meridian-commander $version: PyPI answered $status"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$status" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Asked to publish -- a manual dispatch, or a "[release]" merge -- and it
      # cannot succeed. That is someone forgetting to bump the version, and it
      # should stop loudly with the reason.
      - name: Refuse to re-upload a released version
        if: >-
          steps.pypi.outputs.already == 'true' &&
          !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::meridian-commander ${{ steps.pypi.outputs.version }} is already on PyPI, and PyPI does not allow a file name to be reused, so this upload cannot succeed. Bump the version in pyproject.toml and meridian_commander/__init__.py, then release again."
          exit 1

      # A tag is different: a version can be tagged after it was released --
      # PUBLISHING.md asks for exactly that, since the "[release]" route
      # publishes without leaving a tag behind. Such a tag has nothing to
      # upload, and nothing to upload is done, not broken.
      - name: Already released; the tag is the whole job
        if: >-
          steps.pypi.outputs.already == 'true' &&
          startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::notice::meridian-commander ${{ steps.pypi.outputs.version }} is already on PyPI. This tag records a release that has already happened, so there is nothing to upload."

      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.pypi.outputs.already != 'true'

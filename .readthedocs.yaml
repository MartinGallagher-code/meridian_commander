# Read the Docs configuration.
# Reference: https://docs.readthedocs.com/platform/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
    # The API reference page imports the package (sphinx.ext.autodoc), so the
    # package itself must be installed into the docs build environment. The
    # core has no dependencies, so this is cheap.
    - method: pip
      path: .
